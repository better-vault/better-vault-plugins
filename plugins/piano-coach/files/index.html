<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Piano coach</h1>
          <p id="hint">Play with the mouse, or with your keys: A S D F G H J K for white notes, W E T Y U for black ones.</p>
        </div>
        <div class="score" aria-live="polite"><span id="score">0</span> / <span id="total">0</span></div>
      </header>

      <section class="lessons" aria-label="Lessons">
        <div id="lessons" class="chips"></div>
        <button id="ai" class="chip accent" type="button">✦ New exercise from AI</button>
      </section>

      <section class="staff" aria-label="The notes to play">
        <div id="notes" class="notes"></div>
        <div class="actions">
          <button id="listen" type="button">▶ Listen</button>
          <button id="restart" type="button">↺ Start again</button>
        </div>
      </section>

      <div id="keyboard" class="keyboard" role="group" aria-label="Piano keyboard"></div>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
