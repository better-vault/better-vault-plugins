name: Registry

# On every merge, rebuild the bundles, pictures and registry.json from the
# listed commits; every six hours as well, so each plugin's stars stay
# current. The app and better-vault.dev read registry.json from main, so a
# merged plugin or update appears in both without a release.
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the registry
        run: |
          if [ -z "$(git status --porcelain -- registry.json dist assets)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A registry.json dist assets
          git commit -m "chore: rebuild the registry"
          git push
